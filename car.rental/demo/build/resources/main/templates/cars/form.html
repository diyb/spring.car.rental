<!DOCTYPE html>
<html lang="et" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auto')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('cars')}"></header>
<main>
    <h1 th:text="${car.id == null} ? 'Lisa auto' : 'Muuda autot'">Lisa auto</h1>

    <form class="card" th:action="@{/cars/save}" th:object="${car}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Mark
            <input type="text" th:field="*{brand}" placeholder="Toyota">
            <span class="field-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
        </label>

        <label>Mudel
            <input type="text" th:field="*{model}" placeholder="Corolla">
            <span class="field-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></span>
        </label>

        <label>Aasta
            <input type="number" th:field="*{year}" placeholder="2022">
            <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
        </label>

        <label>Päevahind (€)
            <input type="number" step="0.01" min="0" th:field="*{dailyPrice}" placeholder="35.00">
            <span class="field-error" th:if="${#fields.hasErrors('dailyPrice')}" th:errors="*{dailyPrice}"></span>
        </label>

        <label>Staatus
            <select th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </label>

        <div class="form-actions">
            <button class="btn primary" type="submit">Salvesta</button>
            <a class="btn" th:href="@{/cars}">Tühista</a>
        </div>
    </form>
</main>
</body>
</html>
