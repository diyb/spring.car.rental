spring.application.name=demo

# --- MySQL ---
# Enne kaivitamist loo andmebaas: CREATE DATABASE car_rental_db;  (voi kaivita sql/car_rental_db.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Asenda YOUR_PASSWORD enda MySQL-i parooliga (voi seadista keskkonnamuutuja DB_PASSWORD).
# Kui parool puudub, jata vaartus tuhjaks.
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Esimene administraator ---
# Luuakse automaatselt rakenduse kaivitamisel, kui andmebaasis pole uhtegi ADMIN kasutajat.
# MUUDA parool enne päris kasutust!
app.admin.email=admin@rental.ee
app.admin.password=admin123

# --- Thymeleaf ---
spring.thymeleaf.cache=false
